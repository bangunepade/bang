<script>
(function(){
  const KEY_PARAM="analytics";
  const params=new URLSearchParams(location.search);
  const adminKey=params.get(KEY_PARAM);
  if(adminKey){try{sessionStorage.setItem("bangAnalyticsKey",adminKey)}catch(e){}}
  const adminKeyStored=(()=>{try{return sessionStorage.getItem("bangAnalyticsKey")||""}catch(e){return ""}})();

  let sid="";
  try{
    sid=sessionStorage.getItem("bangVisitorId")||"";
    if(!sid){
      sid=(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2));
      sessionStorage.setItem("bangVisitorId",sid);
    }
  }catch(e){sid=Date.now()+"-"+Math.random().toString(36).slice(2)}

  function send(action){
    const payload={sessionId:sid,action:action,page:location.pathname+location.hash,referrer:document.referrer};
    return fetch("/api/track",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),keepalive:true}).catch(()=>{});
  }
  send("visit");
  const heartbeat=setInterval(()=>send("active"),20000);

  document.addEventListener("click",function(e){
    const el=e.target.closest("button,a");
    if(!el)return;
    const id=(el.id||"").toLowerCase();
    const txt=(el.textContent||"").toLowerCase();
    if(id==="connect" || txt.includes("connect metamask")) send("connect");
  },true);

  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="visible") send("active");
  });

  // Private owner-only mini dashboard. It appears only after the correct
  // BANG_ANALYTICS_KEY is supplied as ?analytics=... once.
  if(adminKeyStored){
    const traceButton=document.createElement("button");
    traceButton.id="bangTrackingButton";
    traceButton.type="button";
    traceButton.textContent="◉ TRACKING";
    traceButton.title="Open BANG TRACE analytics";
    traceButton.setAttribute("aria-label","Open BANG TRACE analytics");
    document.body.appendChild(traceButton);
    const style=document.createElement("style");
    style.textContent=`
      #bangTrackingButton{position:fixed;left:10px;top:62px;z-index:100000;padding:5px 9px;border-radius:7px;border:1px solid rgba(190,170,110,.28);background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(190,145,45,.10));color:rgba(225,211,175,.78);font:700 9px system-ui,Arial;letter-spacing:.10em;backdrop-filter:blur(8px);box-shadow:0 4px 16px rgba(0,0,0,.18);cursor:pointer;opacity:.78;transition:all .2s ease}
      #bangTrackingButton:hover{opacity:1;border-color:rgba(245,211,110,.55);color:#f5d36e;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(190,145,45,.18))}
      #bangTrackingButton:active{transform:translateY(1px)}
      #bangTrace{position:fixed;left:8px;top:91px;z-index:99999;width:235px;background:rgba(5,4,3,.94);
        border:1px solid #3d2b0e;border-radius:10px;box-shadow:0 12px 35px #0009;color:#eee;padding:9px;
        font:11px system-ui,Arial;backdrop-filter:blur(10px)}
      #bangTrace .bt-head{display:flex;justify-content:space-between;align-items:center;color:#f6d36e;font-weight:900;margin-bottom:7px}
      #bangTrace .bt-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #21190d}
      #bangTrace .bt-row:last-child{border:0}
      #bangTrace .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
      #bangTrace .grey{background:#888}.blue{background:#168cff}.red{background:#ff334c}
      #bangTrace .green{color:#22d37b}.market-up{color:#22d37b}.market-down{color:#ff4d61}.market-flat{color:#bdb5a5}
      #bangTrace .bt-list{max-height:180px;overflow:auto;margin-top:5px}
      #bangTrace .ip{font-family:monospace;font-size:10px;color:#d9d0bd}
      #bangTrace .time{color:#80745e;font-size:9px}
      #bangTrace .bt-close{border:0;background:none;color:#8f8062;cursor:pointer}
      @media(max-width:480px){#bangTrackingButton{top:58px;left:7px;font-size:8px;padding:5px 7px}#bangTrace{top:88px;left:7px;width:calc(100vw - 14px)}}
    `;
    document.head.appendChild(style);
    const box=document.createElement("aside");
    box.id="bangTrace";
    box.innerHTML=`<div class="bt-head"><span>◉ BANG TRACE</span><button class="bt-close" title="Hide">×</button></div>
      <div class="bt-row"><span><i class="dot grey"></i>Visitors</span><b id="btVisitors">0</b></div>
      <div class="bt-row"><span><i class="dot blue"></i>Active</span><b id="btActive">0</b></div>
      <div class="bt-row"><span><i class="dot red"></i>Connect</span><b id="btConnect">0</b></div>
      <div class="bt-row"><span>Market</span><b id="btMarket" class="market-flat">—</b></div>
      <div class="bt-row"><span>BNG Price</span><b id="btPrice">—</b></div>
      <div class="bt-list" id="btList"></div>`;
    document.body.appendChild(box);
    box.querySelector(".bt-close").onclick=()=>box.remove();
    traceButton.onclick=()=>{
      const existing=document.getElementById("bangTrace");
      if(existing){existing.style.display=existing.style.display==="none"?"block":"none";return;}
      location.reload();
    };

    async function refreshTrace(){
      try{
        const r=await fetch("/api/analytics",{headers:{Authorization:"Bearer "+adminKeyStored},cache:"no-store"});
        if(!r.ok)return;
        const d=await r.json();
        document.getElementById("btVisitors").textContent=d.counts.visitors;
        document.getElementById("btActive").textContent=d.counts.active;
        document.getElementById("btConnect").textContent=d.counts.connect;
        try{
          const mr=await fetch("/.netlify/functions/bng-price",{cache:"no-store"});
          if(mr.ok){
            const m=await mr.json();
            const change=Number(m.priceChange24h);
            const price=Number(m.priceUsd);
            const marketEl=document.getElementById("btMarket");
            const priceEl=document.getElementById("btPrice");
            if(Number.isFinite(change)){
              const sign=change>0?"+":(change<0?"−":"");
              marketEl.textContent=`${sign}${Math.abs(change).toFixed(2)}%`;
              marketEl.className=change>0?"market-up":(change<0?"market-down":"market-flat");
            }
            if(Number.isFinite(price)) priceEl.textContent=`$${price.toFixed(8)}`;
          }
        }catch(e){}
        const list=document.getElementById("btList");
        list.innerHTML=(d.recent||[]).slice(0,25).map(x=>{
          const cls=x.status==="connect"?"red":(x.status==="active"?"blue":"grey");
          const label=x.status==="connect"?"Connect":(x.status==="active"?"Active":"Visit");
          return `<div class="bt-row"><span><i class="dot ${cls}"></i>${label}</span><span class="ip">${String(x.ip).replace(/[<>&]/g,"")}</span></div>`;
        }).join("");
      }catch(e){}
    }
    refreshTrace(); setInterval(refreshTrace,10000);
  }
})();
</script>
